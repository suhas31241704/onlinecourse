{% extends "OnlineCourse/course_list_bootstrap.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2>{{ course.name }}</h2>
    <p>{{ course.description }}</p>

    <h4>Lessons</h4>
    <ul class="list-group">
        {% for lesson in course.lessons.all %}
        <li class="list-group-item">
            <strong>{{ lesson.order }}. {{ lesson.title }}</strong>
            <p>{{ lesson.content }}</p>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
